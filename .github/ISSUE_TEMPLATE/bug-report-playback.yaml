name: Media playback bug report
description: Create a bug report related to media playback
labels:
  - bug
  - playback
body:
  - type: checkboxes
    id: before-posting
    attributes:
      label: "Before submitting:"
      description: Please confirm the following.
      options:
        - label: I have searched the existing [LumaFin issues](https://github.com/bagodees/LumaFin-AndroidTV/issues) and this has not already been reported.
          required: true
        - label: This report addresses one issue only.
          required: true
        - label: I have removed private information, such as server addresses, account names, access tokens, and passwords, from any logs or screenshots.
          required: true
  - type: markdown
    attributes:
      value: |
        ## Bug information  
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear and concise description of the bug, including steps to reproduce it and the normally expected behavior.
        You can also attach screenshots or screen recordings to help explain your issue.
      placeholder: |
        1. Go to …
        2. Click on …
        3. Scroll down to …
        4. See error / the app crashes

        Instead, I expect …
    validations:
      required: true
  - type: textarea
    id: mediainfo
    attributes:
      label: Media info of the file
      description: |
        Share the media information for the file causing the issue. You can use ffprobe or copy it from the Jellyfin web interface.
      placeholder: Paste media info…
      render: shell
  - type: textarea
    id: mediacapabilitiesreport
    attributes:
      label: Media capabilities report
      description: |
        Please share the playback-capabilities report generated from within LumaFin:
        1. Open LumaFin
        2. Connect to a server **that you have admin access to**
        3. Go to Settings -> Playback -> Advanced playback preferences
        4. Press "Report playback capabilities to server"
        5. Go to the logs in your Jellyfin dashboard (in your browser)
        6. Open the newest uploaded capability-report log and paste its contents
      placeholder: Paste capability report contents…
  - type: markdown
    attributes:
      value: |
        ## Logs
  - type: textarea
    id: logs
    attributes:
      label: Client logs
      description: |
        Paste relevant LumaFin client or Jellyfin server logs here if available.
        Remove server addresses, account names, access tokens, and passwords before submitting.
      placeholder: Paste logs…
  - type: textarea
    id: logs-ffmpeg
    attributes:
      label: FFmpeg logs
      description: |
        Please paste your FFmpeg logs here. You can find these in your servers dashboard under "logs".
      placeholder: Paste logs…
      render: shell
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: app-version
    attributes:
      label: LumaFin version
      description: The version shown in the installed LumaFin app.
      placeholder: 0.1.7
    validations:
      required: true
  - type: dropdown
    id: installation-source
    attributes:
      label: Where did you install the app from?
      description: Choose the appropriate app store or installation method.
      options:
        - GitHub Release
        - Sideloaded APK
        - Google Play Store
  - type: input
    id: device-info
    attributes:
      label: Device information
      description: Manufacturer and model
      placeholder: Nvidia Shield TV Pro (2019), Fire TV Stick HD (2020)
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Version of the OS and other information (e.g. custom ROM / OEM skin)
      placeholder: Android 13, Fire OS 7
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      description: If on unstable, please specify the commit hash.
      placeholder: 10.10.2
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Additional
  - type: input
    id: other-sources
    attributes:
      label: Other sources
      description: Link related issues or discussions, if any.
      placeholder: https://github.com/bagodees/LumaFin-AndroidTV/issues/…
    validations:
      required: false
